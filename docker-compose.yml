version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cloudpulse-backend-dev
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - APP_VERSION=1.0.0-dev
    volumes:
      - ./backend/src:/app/src
    networks:
      - cloudpulse-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cloudpulse-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:4000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cloudpulse-net

networks:
  cloudpulse-net:
    driver: bridge
