version: 0.1
component: deploy
timeoutInSeconds: 600

steps:
  - stepType: Shell
    name: "Pre-deployment Health Verification"
    command: |
      echo "Validating environment readiness for release ${BUILDRUN_HASH}..."

  - stepType: RollingDeployment
    name: "Zero Downtime Rolling Update"
    targetEnvironment: ${OCI_DEPLOY_ENV} # dev or stage
    rollbackOnFailure: true

  - stepType: Shell
    name: "Post-deployment Smoke Verification"
    command: |
      echo "Running live probe on /health..."
      curl -f http://localhost:4000/health || exit 1
