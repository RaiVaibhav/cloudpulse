services:
  # =============================================================
  # 🟢 DEV ENVIRONMENT (Tracks 'develop' branch)
  # =============================================================
  - type: web
    name: cloudpulse-backend-dev
    env: image
    image:
      url: ghcr.io/raivaibhav/cloudpulse-backend:dev-latest
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: cloudpulse-db-dev
          property: connectionString

  # =============================================================
  # 🟡 STAGING ENVIRONMENT (Tracks 'main' branch)
  # =============================================================
  - type: web
    name: cloudpulse-backend-stage
    env: image
    image:
      url: ghcr.io/raivaibhav/cloudpulse-backend:stage-latest
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: cloudpulse-db-stage
          property: connectionString

  # =============================================================
  # 🔴 PRODUCTION ENVIRONMENT (Tracks 'main' release branch)
  # =============================================================
  - type: web
    name: cloudpulse-backend-prod
    env: image
    image:
      url: ghcr.io/raivaibhav/cloudpulse-backend:prod-latest
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: cloudpulse-db-prod
          property: connectionString

databases:
  - name: cloudpulse-db-dev
    databaseName: cloudpulse_dev
    user: cloudpulse_user
    plan: free
    region: oregon

  - name: cloudpulse-db-stage
    databaseName: cloudpulse_stage
    user: cloudpulse_user
    plan: free
    region: oregon

  - name: cloudpulse-db-prod
    databaseName: cloudpulse_prod
    user: cloudpulse_user
    plan: free
    region: oregon
