services:
  # =============================================================
  # 🟢 DEV ENVIRONMENT (Tracks 'develop' branch)
  # =============================================================
  - type: web
    name: cloudpulse-backend-dev
    env: docker
    plan: free
    region: oregon
    branch: develop
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 10000

  - type: web
    name: cloudpulse-frontend-dev
    env: static
    branch: develop
    rootDir: frontend
    buildCommand: cd .. && npm install --include=dev && npm run build --workspace=frontend
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://cloudpulse-backend-dev.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # =============================================================
  # 🟡 STAGING ENVIRONMENT (Tracks 'main' branch)
  # =============================================================
  - type: web
    name: cloudpulse-backend-stage
    env: docker
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 10000

  - type: web
    name: cloudpulse-frontend-stage
    env: static
    branch: main
    rootDir: frontend
    buildCommand: cd .. && npm install --include=dev && npm run build --workspace=frontend
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://cloudpulse-backend-stage.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # =============================================================
  # 🔴 PRODUCTION ENVIRONMENT (Tracks 'main' release branch)
  # =============================================================
  - type: web
    name: cloudpulse-backend-prod
    env: docker
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  - type: web
    name: cloudpulse-frontend-prod
    env: static
    branch: main
    rootDir: frontend
    buildCommand: cd .. && npm install --include=dev && npm run build --workspace=frontend
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://cloudpulse-backend-prod.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
