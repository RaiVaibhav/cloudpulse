services:
  # -------------------------------------------------------------
  # 1. CloudPulse Backend API (Free Web Service)
  # -------------------------------------------------------------
  - type: web
    name: cloudpulse-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # -------------------------------------------------------------
  # 2. CloudPulse Frontend SPA (Free Static Web Service)
  # -------------------------------------------------------------
  - type: web
    name: cloudpulse-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
