version: '3.8'

services:
  backend:
    image: ghcr.io/${REPO_OWNER:-user}/cloudpulse-backend:prod-latest
    container_name: cloudpulse-backend-prod
    restart: always
    environment:
      - PORT=4000
      - NODE_ENV=production
      - APP_VERSION=${APP_VERSION:-1.0.0}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cloudpulse-prod-net

  frontend:
    image: ghcr.io/${REPO_OWNER:-user}/cloudpulse-frontend:prod-latest
    container_name: cloudpulse-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cloudpulse-prod-net

networks:
  cloudpulse-prod-net:
    driver: bridge
