version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudpulse-backend-stage
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=staging
      - APP_VERSION=1.0.0-stage
    networks:
      - cloudpulse-stage-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudpulse-frontend-stage
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cloudpulse-stage-net
    restart: unless-stopped

networks:
  cloudpulse-stage-net:
    driver: bridge
