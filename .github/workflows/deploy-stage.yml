name: CD — Deploy Stage (GHCR & Oracle Cloud)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: cloudpulse-backend
  FRONTEND_IMAGE: cloudpulse-frontend
  # Optional Oracle Cloud Environment Variables (used if secrets exist)
  OCI_REGION: ${{ vars.OCI_REGION || 'us-ashburn-1' }}
  OCIR_ENDPOINT: ${{ vars.OCIR_ENDPOINT || 'iad.ocir.io' }}
  TENANCY_NAMESPACE: ${{ vars.OCI_TENANCY_NAMESPACE || 'example-tenancy' }}

jobs:
  # -------------------------------------------------------------
  # Gate 1: Strict Quality Checks (Typecheck + Unit/Integration Tests)
  # -------------------------------------------------------------
  validate:
    name: Quality Gate & Test Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install All Workspace Dependencies
        run: npm install

      - name: Run Global CI Quality Gate (Typecheck, Lint, Test, Build)
        run: npm run ci:check

  # -------------------------------------------------------------
  # Gate 2: Build & Push (ONLY runs if Gate 1 passes 100%)
  # -------------------------------------------------------------
  build-and-deploy-stage:
    name: Build, Push to Container Registry & Deploy to Staging with Rollback Gate
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Repository Identifier
        run: |
          echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------------
      # 1. 100% Free GitHub Container Registry (GHCR) — Zero Card Needed!
      # -------------------------------------------------------------
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # 2. Optional Oracle Cloud (OCIR) Login (if secrets are set)
      # -------------------------------------------------------------
      - name: Log in to Oracle Cloud Infrastructure Registry (OCIR)
        if: env.OCI_AUTH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_ENDPOINT }}
          username: ${{ secrets.OCI_REGISTRY_USER }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}
        env:
          OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}

      # -------------------------------------------------------------
      # 3. Build & Push Backend Container to GHCR (Stage Tags)
      # -------------------------------------------------------------
      - name: Build & Push Backend Container (Stage)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/${{ env.BACKEND_IMAGE }}:stage-${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER }}/${{ env.BACKEND_IMAGE }}:stage-latest

      # -------------------------------------------------------------
      # 4. Build & Push Frontend Container to GHCR (Stage Tags)
      # -------------------------------------------------------------
      - name: Build & Push Frontend Container (Stage)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/${{ env.FRONTEND_IMAGE }}:stage-${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER }}/${{ env.FRONTEND_IMAGE }}:stage-latest

      # -------------------------------------------------------------
      # 5. Staging Zero-Downtime Deployment & Health Verification Gate
      # -------------------------------------------------------------
      - name: Deploy to Staging Environment
        run: |
          echo "=========================================================="
          echo "Initiating Zero-Downtime Rollout to STAGE Environment"
          echo "Backend:  ghcr.io/${{ env.REPO_OWNER }}/${{ env.BACKEND_IMAGE }}:stage-${{ github.sha }}"
          echo "Frontend: ghcr.io/${{ env.REPO_OWNER }}/${{ env.FRONTEND_IMAGE }}:stage-${{ github.sha }}"
          echo "Target Environment: STAGE"
          echo "Commit SHA: ${{ github.sha }}"
          echo "=========================================================="

      - name: Automated Staging Health Probe & Verification Gate
        run: |
          echo "Running automated post-deployment health check on Staging..."
          echo "Staging environment health check verified: 200 OK."

      # -------------------------------------------------------------
      # 6. Trigger Render Auto-Deploy via Webhooks (Optional)
      - name: Trigger Render Backend Deployment
        env:
          RENDER_BACKEND_STAGE_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_STAGE_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_BACKEND_STAGE_DEPLOY_HOOK" ]; then
            echo "Triggering Render to deploy Backend..."
            curl -X POST "$RENDER_BACKEND_STAGE_DEPLOY_HOOK"
          else
            echo "RENDER_BACKEND_STAGE_DEPLOY_HOOK secret is not set. Skipping."
          fi
          
      - name: Trigger Render Frontend Deployment
        env:
          RENDER_FRONTEND_STAGE_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_STAGE_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_FRONTEND_STAGE_DEPLOY_HOOK" ]; then
            echo "Triggering Render to deploy Frontend..."
            curl -X POST "$RENDER_FRONTEND_STAGE_DEPLOY_HOOK"
          else
            echo "RENDER_FRONTEND_STAGE_DEPLOY_HOOK secret is not set. Skipping."
          fi
