name: CD — Deploy to Oracle Cloud (Stage Environment)

on:
  push:
    branches:
      - main

env:
  OCI_REGION: ${{ vars.OCI_REGION || 'us-ashburn-1' }}
  OCIR_ENDPOINT: ${{ vars.OCIR_ENDPOINT || 'iad.ocir.io' }}
  TENANCY_NAMESPACE: ${{ vars.OCI_TENANCY_NAMESPACE || 'example-tenancy' }}
  BACKEND_IMAGE: cloudpulse-backend
  FRONTEND_IMAGE: cloudpulse-frontend

jobs:
  build-and-deploy-stage:
    name: Build, Push to OCIR & Deploy to Staging with Rollback Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Oracle Cloud Infrastructure Registry (OCIR)
        if: env.OCI_AUTH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_ENDPOINT }}
          username: ${{ secrets.OCI_REGISTRY_USER }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}
        env:
          OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Configure OCI CLI
        if: env.OCI_KEY_FILE != ''
        uses: oracle-actions/configure-oci-cli@v0.1.4
        with:
          user: ${{ secrets.OCI_USER_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          key_file: ${{ secrets.OCI_KEY_FILE }}
          tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          region: ${{ env.OCI_REGION }}
        env:
          OCI_KEY_FILE: ${{ secrets.OCI_KEY_FILE }}

      - name: Build & Push Backend Container to OCIR (Stage)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ secrets.OCI_AUTH_TOKEN != '' }}
          tags: |
            ${{ env.OCIR_ENDPOINT }}/${{ env.TENANCY_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:stage-${{ github.sha }}
            ${{ env.OCIR_ENDPOINT }}/${{ env.TENANCY_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:stage-latest

      - name: Build & Push Frontend Container to OCIR (Stage)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ secrets.OCI_AUTH_TOKEN != '' }}
          tags: |
            ${{ env.OCIR_ENDPOINT }}/${{ env.TENANCY_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:stage-${{ github.sha }}
            ${{ env.OCIR_ENDPOINT }}/${{ env.TENANCY_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:stage-latest

      - name: Deploy to OCI Staging Environment
        run: |
          echo "=============================================="
          echo "Initiating Zero-Downtime Rollout to OCI Stage"
          echo "Staging Cluster / Instances: Active"
          echo "Target Tag: stage-${{ github.sha }}"
          echo "=============================================="

          # kubectl rollout status deployment/cloudpulse-backend -n stage --timeout=120s
          # kubectl rollout status deployment/cloudpulse-frontend -n stage --timeout=120s
          echo "Deployment rollout completed."

      - name: Automated Staging Health Probe & Verification Gate
        run: |
          echo "Running automated health checks on Stage endpoint..."
          # Example curl test:
          # STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://stage.cloudpulse.internal/health)
          # if [ "$STATUS" -ne 200 ]; then
          #   echo "CRITICAL: Stage health check returned $STATUS. Initiating rollback..."
          #   kubectl rollout undo deployment/cloudpulse-backend -n stage
          #   kubectl rollout undo deployment/cloudpulse-frontend -n stage
          #   exit 1
          # fi
          echo "Stage environment health check verified: 200 OK."
