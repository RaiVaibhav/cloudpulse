name: CI Quality Gate & Build-Fail Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate-backend:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: TypeScript Compilation Check (tsc --noEmit)
        working-directory: ./backend
        run: |
          echo "Verifying TypeScript types for Backend..."
          npm run typecheck

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        run: |
          echo "Running Jest test suite..."
          npm run test

      - name: Build Backend Production Artifact
        working-directory: ./backend
        run: |
          echo "Building backend JavaScript bundle..."
          npm run build

  validate-frontend:
    name: Frontend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: TypeScript Compilation Check (tsc --noEmit)
        working-directory: ./frontend
        run: |
          echo "Verifying TypeScript types for Frontend..."
          npm run typecheck

      - name: Run Frontend Tests (Vitest)
        working-directory: ./frontend
        run: |
          echo "Running Vitest test suite..."
          npm run test

      - name: Build Frontend Production Artifact (Vite)
        working-directory: ./frontend
        run: |
          echo "Building production React static assets..."
          npm run build

  docker-smoke-build:
    name: Docker Multi-Stage Build & Smoke Verification
    needs: [validate-backend, validate-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: cloudpulse-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: cloudpulse-frontend:ci-test

      - name: Run Backend Smoke Container Test
        run: |
          echo "Starting backend container for live health verification..."
          docker run -d --name test-backend -p 4000:4000 cloudpulse-backend:ci-test
          sleep 5
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health)
          docker stop test-backend
          docker rm test-backend
          if [ "$HEALTH_STATUS" -ne 200 ]; then
            echo "Smoke test FAILED! Expected 200 from /health but received: $HEALTH_STATUS"
            exit 1
          fi
          echo "Backend container passed smoke test with HTTP 200 OK."
