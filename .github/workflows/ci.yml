name: CI Quality Gate & Build-Fail Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate-monorepo:
    name: Monorepo Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install All Workspace Dependencies
        run: npm install

      - name: Run Global CI Quality Gate (Typecheck, Lint, Test, Build)
        run: npm run ci:check

  docker-smoke-build:
    name: Docker Multi-Stage Build & Smoke Verification
    needs: [validate-monorepo]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: cloudpulse-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: cloudpulse-frontend:ci-test

      - name: Run Backend Smoke Container Test
        run: |
          echo "Starting backend container for live health verification..."
          docker run -d --name test-backend -p 4000:4000 cloudpulse-backend:ci-test
          sleep 5
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health)
          docker stop test-backend
          docker rm test-backend
          if [ "$HEALTH_STATUS" -ne 200 ]; then
            echo "Smoke test FAILED! Expected 200 from /health but received: $HEALTH_STATUS"
            exit 1
          fi
          echo "Backend container passed smoke test with HTTP 200 OK."
