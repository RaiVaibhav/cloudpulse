apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-backend
  namespace: production
  labels:
    app: cloudpulse-backend
    tier: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cloudpulse-backend
  template:
    metadata:
      labels:
        app: cloudpulse-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/YOUR_GITHUB_USER/cloudpulse-backend:prod-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-backend-svc
  namespace: production
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: cloudpulse-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-frontend
  namespace: production
  labels:
    app: cloudpulse-frontend
    tier: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cloudpulse-frontend
  template:
    metadata:
      labels:
        app: cloudpulse-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/YOUR_GITHUB_USER/cloudpulse-frontend:prod-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-frontend-svc
  namespace: production
spec:
  type: LoadBalancer # In OCI OKE, automatically provisions an OCI Flexible Load Balancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: cloudpulse-frontend
